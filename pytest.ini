[pytest]
testpaths = tests
pythonpath = .
markers =
    model: downloads and runs the real SigLIP2 model (~4.5 GB); run with -m model
    milvus: writes to the real Zilliz cluster in .env (throwaway test collection); run with -m milvus
addopts = -m "not model and not milvus"
filterwarnings =
    ignore::DeprecationWarning
