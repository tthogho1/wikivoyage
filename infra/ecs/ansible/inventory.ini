# This stack has no servers to manage config on (Fargate is serverless), so the
# single "host" is localhost: Ansible here just orchestrates `docker build`,
# `docker push`, and `aws ecs update-service --force-new-deployment` from your
# own machine (or a CI runner) using the AWS CLI / credentials already configured
# (same credentials Terraform uses).
[local]
localhost ansible_connection=local
