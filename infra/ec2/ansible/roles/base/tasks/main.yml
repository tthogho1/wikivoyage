- name: Install base packages
  ansible.builtin.apt:
    name: [git, curl, ca-certificates, gnupg, build-essential, python3-venv, python3-dev, unattended-upgrades, acl]
    update_cache: true
    cache_valid_time: 3600

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Create swap file (headroom for npm build and model loading)
  ansible.builtin.command: >
    bash -c "fallocate -l {{ swap_size_mb }}M /swapfile && chmod 600 /swapfile && mkswap /swapfile"
  args:
    creates: /swapfile

- name: Enable swap now
  ansible.builtin.command: swapon /swapfile
  register: swapon
  changed_when: swapon.rc == 0
  failed_when: swapon.rc != 0 and 'busy' not in swapon.stderr

- name: Enable swap at boot
  ansible.posix.mount:
    src: /swapfile
    path: none
    fstype: swap
    opts: sw
    state: present

- name: Create the service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_root }}"
    create_home: false

- name: Create app directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  loop: ["{{ app_root }}", "{{ hf_home }}"]
